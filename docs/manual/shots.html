<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>QuickDeck 설명서 스크린샷 (개발용)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 사용설명서용 화면을 가짜 데이터로 띄운다. (npx vite 실행 후 ?view=...&theme=...)
      const qs = new URLSearchParams(location.search);
      const view = qs.get("view") || "home";
      const w = qs.get("w") || 420, h = qs.get("h") || 330;
      document.write(`<style>html,body,#root{width:${w}px !important;height:${h}px !important}</style>`);
      // ?bg=check : 투명도 확인용 뒤 배경 (바둑판 + 글씨)
      if (qs.get("bg") === "check") document.write(`<style>html{background:repeating-conic-gradient(#d0d4da 0 25%,#ffffff 0 50%) 0 0/24px 24px !important}body::before{content:"뒤에 있는 문서가 비쳐 보여요 — 투명도 확인";position:fixed;left:16px;top:120px;font:700 30px sans-serif;color:#e0245e;z-index:-1}</style>`);

      const toUrl = (p) => fetch(p).then((r) => r.blob()).then((b) => new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); }));
      const k = (id, label, icon, color, keys) => ({ id, label, icon, color, hotkey: "", action: { type: "keys", keys, app: "" } });

      const cfgPromise = Promise.all(["hwp", "chrome", "starcraft"].map((n) => toUrl(`/docs/manual/assets/${n}.png`))).then(([hwp, chrome, sc]) => ({
        toggleHotkey: "Ctrl+Shift+Space",
        columns: 4,
        theme: qs.get("theme") || "dark",
        opacity: Number(qs.get("op") || 100),
        clearOnHover: false,
        buttons: [
          { id: "hwp", label: "한글", icon: "한", image: hwp, imageAuto: true, color: "#1c1c1e", hotkey: "Ctrl+Alt+KeyH",
            action: { type: "folder", apps: ["Hwp.exe"], launch: "C:\\Program Files (x86)\\Hnc\\Office 2020\\HOffice110\\Bin\\Hwp.exe", buttons: [
              k("h1", "새 문서", "📄", "#0a84ff", "alt+n"), k("h2", "불러오기", "📂", "#0a84ff", "alt+o"), k("h3", "저장", "💾", "#0a84ff", "alt+s"),
              k("h4", "인쇄", "🖨️", "#0a84ff", "alt+p"), k("h5", "표 만들기", "▦", "#0a84ff", "ctrl+n t"), k("h6", "찾기", "🔍", "#0a84ff", "ctrl+q f"),
              { id: "h7", label: "서식", icon: "🔤", color: "#8e8e93", hotkey: "", action: { type: "folder", apps: [], launch: "", buttons: [k("s1", "진하게", "𝐁", "#8e8e93", "ctrl+b"), k("s2", "기울임", "𝐼", "#8e8e93", "ctrl+i"), k("s3", "밑줄", "U̲", "#8e8e93", "ctrl+u")] } },
            ] } },
          { id: "web", label: "웹 브라우저", icon: "🌐", image: chrome, imageAuto: true, color: "#1c1c1e", hotkey: "",
            action: { type: "folder", apps: ["chrome.exe", "msedge.exe", "whale.exe"], launch: "", buttons: [k("w1", "새 탭", "➕", "#40c8e0", "ctrl+t"), k("w2", "탭 닫기", "✖️", "#40c8e0", "ctrl+w")] } },
          { id: "sc", label: "스타크래프트", icon: "🎮", image: sc, imageAuto: true, color: "#1c1c1e", hotkey: "", action: { type: "launch", target: "StarCraft.exe", args: "" } },
          { id: "np", label: "메모장", icon: "📝", color: "#ff9f0a", hotkey: "", action: { type: "launch", target: "notepad.exe", args: "" } },
          { id: "routine", label: "아침 루틴", icon: "☀️", color: "#ff375f", hotkey: "Ctrl+Alt+KeyM",
            action: { type: "multi", steps: [
              { type: "launch", target: "notepad.exe", args: "" },
              { type: "delay", ms: 1000 },
              { type: "text", text: "오늘 할 일:", app: "" },
              { type: "keys", keys: "ctrl+s", app: "" },
            ] } },
          k("cap", "화면 캡처", "✂️", "#30d158", "win+shift+s"),
          k("vol", "볼륨 +", "🔊", "#5e5ce6", "volumeup"),
          k("mute", "음소거", "🔇", "#ff453a", "mute"),
        ],
      }));

      // 설명서 사진용 QR 모양 (실제 앱은 Rust 가 진짜 QR 코드를 만든다)
      const QR_SAMPLE = (() => {
        let r = "";
        for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
          const finder = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
          const on = finder ? (x % 6 === 0 || y % 6 === 0 || (x % 6 > 1 && x % 6 < 5 && y % 6 > 1 && y % 6 < 5) || x === 18 || x === 24 || y === 18 || y === 24) : ((x * 7 + y * 13 + x * y) % 3 === 0);
          if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 29 29"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#111">${r}</g></svg>`;
      })();
      const L = {};
      const T0 = Date.now();
      const TOGGLES = { mic: true };
      window.__TAURI_INTERNALS__ = {
        transformCallback: (cb) => { const id = Math.floor(Math.random() * 1e9); window["_" + id] = cb; return id; },
        unregisterCallback: () => {},
        invoke: async (cmd, a) => {
          if (cmd === "get_config") {
            const c = structuredClone(await cfgPromise);
            // ?view=widgets : 위젯·토글·창 배치 버튼 모음
            if (view.startsWith("widgets")) c.buttons = [
              { id: "clk", label: "", icon: "🕒", color: "#1c1c1e", hotkey: "", action: { type: "clock" } },
              { id: "tmr", label: "라면 타이머", icon: "⏱", color: "#ff9f0a", hotkey: "", action: { type: "timer", minutes: 5 } },
              { id: "sys", label: "PC 상태", icon: "📈", color: "#5e5ce6", hotkey: "", action: { type: "sysInfo" } },
              { id: "mic", label: "마이크 끄기", icon: "🎙", color: "#30d158", hotkey: "", action: { type: "toggle", first: { type: "keys", keys: "win+alt+k", app: "" }, second: { type: "keys", keys: "win+alt+k", app: "" }, altLabel: "마이크 켜기", altIcon: "🔇" } },
              { id: "wl", label: "왼쪽 절반", icon: "◧", color: "#0a84ff", hotkey: "", action: { type: "window", mode: "left" } },
              { id: "wr", label: "오른쪽 절반", icon: "◨", color: "#0a84ff", hotkey: "", action: { type: "window", mode: "right" } },
              { id: "wm", label: "다음 모니터", icon: "🖥️", color: "#40c8e0", hotkey: "", action: { type: "window", mode: "nextMonitor" } },
              { ...k("lp", "볼륨", "🔊", "#bf5af2", "volumeup"), longAction: { type: "keys", keys: "mute", app: "" } },
            ];
            return c;
          }
          // 영상용: 타이머는 실제로 줄어들고, CPU 는 조금씩 움직인다 (사진은 첫 순간이라 그대로)
          if (cmd === "get_widgets") { const el = Date.now() - T0; return { cpu: 23 + Math.round(8 * Math.sin(el / 900)), memory: 61, timers: { tmr: { remainingMs: Math.max(0, 192000 - el), running: true, done: false } } }; }
          if (cmd === "get_toggles") return { ...TOGGLES };
          if (cmd === "run_button" && a.id in TOGGLES) { TOGGLES[a.id] = !TOGGLES[a.id]; for (const h of L["toggle-changed"] || []) window["_" + h]({ event: "toggle-changed", payload: { id: a.id, on: TOGGLES[a.id] } }); return null; }
          if (cmd === "take_startup_notices") return [];
          if (cmd === "plugin:app|version") return "0.7.3";
          if (cmd === "current_app") return view === "auto" ? { exe: "Hwp.exe", folderId: "hwp" } : { exe: "explorer.exe", folderId: null };
          if (cmd === "get_app_icon") { const c = await cfgPromise; const t = a.target.toLowerCase(); return (t.includes("hwp") ? c.buttons[0] : t.includes("starcraft") ? c.buttons[2] : c.buttons[1]).image; }
          if (cmd === "remote_status") return { enabled: true, running: true, url: "http://192.168.0.12:47823/?t=0123456789abcdef0123456789abcdef", qrSvg: QR_SAMPLE, usbUrl: view === "settings-usb" ? "http://192.168.42.129:47823/?t=0123456789abcdef0123456789abcdef" : null, usbQrSvg: view === "settings-usb" ? QR_SAMPLE : "", error: null };
          if (cmd === "plugin:event|listen") { (L[a.event] ||= []).push(a.handler); return a.handler; }
          return null;
        },
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const q = (s) => [...document.querySelectorAll(s)];
      const tile = (t) => q(".tile").find((x) => x.textContent.includes(t));
      const edit = () => q("header button").find((b) => b.title === "버튼 편집")?.click();
      const scrollPanelTo = (el) => { const p = document.querySelector(".panel"); if (p && el) p.scrollTop = el.offsetTop - 8; };
      const label = (t) => q(".editor label").find((l) => l.textContent.trim().startsWith(t));

      (async () => {
        await wait(900);
        if (view === "folder") tile("한글")?.click();
        if (view === "edit") { edit(); await wait(150); tile("메모장")?.click(); }
        if (view === "edit-icon") { edit(); await wait(150); tile("스타크래프트")?.click(); }
        if (view === "edit-keys") { edit(); await wait(150); tile("화면 캡처")?.click(); await wait(150); scrollPanelTo(label("보낼 키")); }
        if (view === "edit-folder") { edit(); await wait(150); tile("한글")?.click(); await wait(150); scrollPanelTo(document.querySelector(".folder-info")); }
        if (view === "edit-multi") { edit(); await wait(150); tile("아침 루틴")?.click(); await wait(150); q(".step-head")[1]?.click(); await wait(100); scrollPanelTo(document.querySelector(".steps")); }
        if (view === "settings") { edit(); await wait(250); scrollPanelTo(label("화면 테마")); }
        if (view === "settings-2") { edit(); await wait(250); scrollPanelTo(label("프로그램 프리셋")); }
        if (view === "widgets-edit") { edit(); await wait(150); tile("라면")?.click(); }
        if (view === "update") { const h = L["update-available"]?.[0]; if (h) window["_" + h]({ event: "update-available", payload: { version: "0.7.1", current: "0.7.0", notes: "" } }); }
        if (view === "settings-look") { edit(); await wait(250); scrollPanelTo(label("창 투명도")); }
        if (view === "settings-usb") { edit(); await wait(400); scrollPanelTo(label("휴대폰 리모컨")); }
        if (view === "settings-usb-wait") { edit(); await wait(400); [...document.querySelectorAll(".remote-via button")][1]?.click(); await wait(150); scrollPanelTo(label("휴대폰 리모컨")); }
        if (view === "settings-remote") { edit(); await wait(400); scrollPanelTo(label("휴대폰 리모컨")); }
        await wait(300);
        document.title = "READY";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
