# 자동 배포: v로 시작하는 태그(예: v0.7.1)를 푸시하면
# Windows 설치 파일을 빌드·서명하고 GitHub 릴리스에 설치 파일과 latest.json 을 올려 게시한다.
# (이미 있는 태그를 다시 배포하려면 Actions 탭 → Release → Run workflow 에서 태그 이름 입력)
#
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#   TAURI_SIGNING_PRIVATE_KEY = %USERPROFILE%\.tauri\quickdeck.key 파일 내용
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 태그 (예: v0.7.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 릴리스 설명 (태그 메시지)
        id: notes
        shell: bash
        run: |
          git fetch --force --tags
          body="$(git tag -l --format='%(contents)' "$TAG")"
          [ -z "$body" ] && body="QuickDeck $TAG"
          {
            echo "body<<__NOTES__"
            echo "$body"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 키에 암호를 걸지 않았으므로 빈 값
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.TAG }}
          releaseName: QuickDeck ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      # 1) 버전 번호 없는 고정 이름으로도 올린다 → 릴리스 페이지를 거치지 않는 고정 다운로드 링크
      #    https://github.com/<저장소>/releases/latest/download/QuickDeck-setup.exe
      # 2) GitHub 릴리스 경로가 막힐 때를 위한 예비 업데이트 정보:
      #    updates 브랜치의 latest.json (raw.githubusercontent.com 으로 읽음).
      #    설치 파일 주소는 다른 경로(api.github.com 의 파일 내려받기)로 바꿔 둔다. 서명은 같은 파일이라 그대로 유효.
      - name: 고정 다운로드 링크와 예비 업데이트 정보
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          exe=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          cp "$exe" QuickDeck-setup.exe
          gh release upload "$TAG" QuickDeck-setup.exe --clobber --repo "$REPO"

          gh release download "$TAG" -p latest.json -D upd --repo "$REPO" --clobber
          asset_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name | test("_x64-setup\\.exe$")) | .id')
          api_url="https://api.github.com/repos/$REPO/releases/assets/$asset_id"
          jq --arg u "$api_url" '.platforms |= with_entries(.value.url = $u)' upd/latest.json > upd/latest.tmp
          mv upd/latest.tmp upd/latest.json
          cat upd/latest.json

          cd upd
          git init -q
          git checkout -q -b updates
          git add latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "latest.json $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" updates
